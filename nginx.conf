server {
    # Makes Nginx listen on the assignment's required port.
    listen 8083;

    # Accepts requests made through localhost.
    server_name localhost;

    # Tells Nginx where the production website files are stored.
    root /divino_paolo_ui_garden;

    # Uses index.html as the starting page.
    index index.html;

    location / {
        # Serves the requested file when it exists.
        # Otherwise, it returns index.html so React routes still work.
        try_files $uri $uri/ /index.html;
    }
}